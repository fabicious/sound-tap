<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sound Tap</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <header>
            <h1>Sound Tap</h1>
        </header>

        <div class="controls">
            <button id="stop-all-btn" class="stop-all-btn">■ Stop All Sounds</button>
            <div class="sound-pack-selector">
                <label for="sound-pack-select">Sound Pack:</label>
                <select id="sound-pack-select" class="sound-pack-select">
                    <option value="">Loading...</option>
                </select>
                <div class="pack-actions">
                    <button id="new-pack-btn" class="pack-action-btn" title="Create new pack">+</button>
                    <button id="rename-pack-btn" class="pack-action-btn" title="Rename pack">✏</button>
                    <button id="delete-pack-btn" class="pack-action-btn pack-action-btn-danger" title="Delete pack">🗑</button>
                    <button id="import-pack-btn" class="pack-action-btn" title="Import pack from JSON">📂</button>
                </div>
            </div>
            <div class="global-volume">
                <span class="volume-icon">♪</span> <input type="range" id="global-volume-slider" min="0" max="100" value="80" class="volume-slider">
            </div>
        </div>

        <div class="search-bar">
            <input type="text" id="search-input" placeholder="Search sounds...">
        </div>

        <div id="now-playing" class="now-playing"></div>

        <div id="empty-state" class="empty-state" style="display:none">
            <p>No sound packs yet.</p>
            <p>Create a new pack or import one to get started.</p>
        </div>

        <div id="sound-list" class="sound-list">
            <!-- Sound items will be populated by JavaScript -->
        </div>

        <div class="reset-section">
            <div class="reset-buttons">
                <button id="reset-settings-btn" class="reset-btn"
                    title="Reset all volume and loop settings to defaults">
                    Reset All Settings
                </button>
                <button id="export-settings-btn" class="export-btn"
                    title="Download your current pack as a JSON file">
                    Export Pack
                </button>
                <button id="clear-storage-btn" class="reset-btn"
                    title="Delete all IndexedDB data and reload">
                    Clear Storage
                </button>
            </div>
            <p class="reset-description">Reset to defaults or export your current pack configuration</p>
            <p id="storage-usage" class="storage-usage"></p>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
