<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sound Tap</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <header>
            <h1>Sound Tap</h1>
        </header>

        <div class="controls">
            <button id="stop-all-btn" class="stop-all-btn">🛑 Stop All Sounds</button>
            <div class="sound-pack-selector">
                <label for="sound-pack-select">📦 Sound Pack:</label>
                <select id="sound-pack-select" class="sound-pack-select">
                    <option value="sounds.json">Loading...</option>
                </select>
            </div>
            <div class="global-volume">
                🔊 <input type="range" id="global-volume-slider" min="0" max="100" value="80" class="volume-slider">
            </div>
        </div>

        <div class="search-bar">
            <input type="text" id="search-input" placeholder="Search sounds...">
        </div>

        <div id="now-playing" class="now-playing"></div>

        <div id="sound-list" class="sound-list">
            <!-- Sound items will be populated by JavaScript -->
        </div>

        <div class="reset-section">
            <div class="reset-buttons">
                <button id="reset-settings-btn" class="reset-btn"
                    title="Reset all volume and loop settings to JSON defaults">
                    🔄 Reset All Settings
                </button>
                <button id="export-settings-btn" class="export-btn"
                    title="Download your current settings as a JSON file">
                    📥 Export Settings
                </button>
            </div>
            <p class="reset-description">Reset to defaults or backup your current volume and loop preferences</p>
            <p class="keyboard-shortcut-info">💡 Tip: Press <kbd>Ctrl+R</kbd> (or <kbd>⌘+R</kbd> on Mac) to refresh
                sound packs after updating JSON files</p>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
